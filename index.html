<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Basic Calculator</title>
</head>
<body>
    <h1 id="heading">Basic Calculator</h1>
    <div id="calculator">
        <div id="display"></div>
        <div id="buttons">
            <button id="btn-7" class="operand">7</button>
            <button id="btn-8" class="operand">8</button>
            <button id="btn-9" class="operand">9</button>
            <button id="btn-del">DEL</button>
            <button id="btn-clr">AC</button>
            <button id="btn-4" class="operand">4</button>
            <button id="btn-5" class="operand">5</button>
            <button id="btn-6" class="operand">6</button>
            <button id="btn-add" class="operator">+</button>
            <button id="btn-sub" class="operator">-</button>
            <button id="btn-1" class="operand">1</button>
            <button id="btn-2" class="operand">2</button>
            <button id="btn-3" class="operand">3</button>
            <button id="btn-multiply" class="operator">x</button>
            <button id="btn-divide" class="operator">÷</button>
            <button id="btn-dot">.</button>
            <button id="btn-0" class="operand">0</button>
            <button id="btn-mod" class="operator">%</button>
            <button id="btn-power" class="operator">^</button>
            <button id="btn-equals">=</button>
        </div>
    </div>
</body>
</html>
